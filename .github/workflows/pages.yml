# Publishes the web/ folder to GitHub Pages on every push to main.
# One-time: Settings → Pages → Source: GitHub Actions.
name: Deploy app to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # every publish is a new app version, so installed phones update by themselves (no manual bump)
      - name: Stamp the version
        run: sed -i "s/^var VERSION = '[^']*';/var VERSION = 'catat999-${GITHUB_SHA::7}';/" web/sw.js && grep -n "^var VERSION" web/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
